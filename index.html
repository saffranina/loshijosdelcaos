<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los hijos del caos: El último dado</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #0a0708;
      background-image: radial-gradient(ellipse at 50% 40%, #1a1013 0%, #0a0708 70%);
      color: #c9b8a8;
      font-family: 'Spectral', Georgia, serif;
      display: flex; flex-direction: column;
    }
    /* El canvas mide 800x600 píxeles reales. Se muestra a ese mismo tamaño,
       SIEMPRE: cualquier escala fraccionaria (estirar 800px sobre 746,66)
       deja el texto entre píxeles y se ve borroso. Si la ventana es más
       chica preferimos que la página se pueda desplazar antes que perder
       nitidez. */
    #game {
      width: 800px;
      height: 600px;
      flex: none;
      /* margin:auto centra igual que justify-content, pero si la ventana es
         más chica que 800x600 el desborde sigue siendo alcanzable con scroll
         en vez de quedar cortado a la izquierda. */
      margin: auto;
      box-shadow: 0 0 0 1px #3a2a28, 0 24px 70px rgba(0,0,0,.8);
      border-radius: 2px;
      overflow: hidden;
    }
    #game canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js?v=20260903c"></script>
</body>
</html>
